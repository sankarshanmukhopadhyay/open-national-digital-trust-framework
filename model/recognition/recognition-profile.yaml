schema_version: '1.0'
id: REC-001
title: Bounded external-framework recognition profile
status: candidate-example
recognising_authority: ROLE-GA
recognised_framework: EXTERNAL-FRAMEWORK-A
recognised_version: '1.0'
basis:
  type: governance-decision
  record: REC-DEC-001
scope:
  roles:
  - service-provider
  services:
  - delegated-authority-verification
  exclusions:
  - final-remedy-equivalence
equivalence:
- id: EQV-001
  dimension: identity-and-attribution
  result: equivalent
  basis: documented evidence semantics
- id: EQV-002
  dimension: authority-evaluation
  result: conditionally-equivalent
  conditions:
  - scope and revocation semantics preserved
- id: EQV-003
  dimension: operational-supervision
  result: not-established
  conditions:
  - external supervision evidence required
- id: EQV-004
  dimension: rights-and-remedy
  result: not-equivalent
  conditions:
  - route complaints to recognising framework authority
lifecycle:
  review_interval_days: 180
  suspension_triggers:
  - material-version-change
  - incident-nondisclosure
  - status-interface-failure
  withdrawal_requires:
  - decision-record
  - effective-date
  - transition-notice
  revocation_state: not-revoked
  revocation_requires:
  - decision-record
  - effective-date
  - status-publication
  - transition-notice
limitations:
- Illustrative evidence profile; does not establish legal recognition of any real
  external framework.
assurance_ceiling:
  maximum_inherited_level: profile-declared-only
  rule: Recognition MUST NOT cause a recognised framework to inherit an assurance
    level higher than the lowest supported equivalent dimension.
  excluded_claims:
  - final-remedy-equivalence
validity:
  effective_at: '2026-01-01T00:00:00Z'
  expires_at: '2026-06-30T23:59:59Z'
  state: active
  review_required_before_renewal: true
evidence_basis:
- REC-DEC-001
- documented evidence semantics
- external supervision evidence where equivalence is claimed
weakest_link_rule: A relying decision MUST apply the lowest applicable supported assurance
  among the recognised dimensions used for that decision.
