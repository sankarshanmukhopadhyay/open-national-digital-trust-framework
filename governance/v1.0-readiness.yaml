schema_version: 1
framework: ONDTF
target_release: v1.0.0
target_specification_maturity: stable
source_maturity_authority: governance/maturity.yaml
promotion_ready: false
state_vocabulary:
  - satisfied
  - evidence-required
  - blocked

external_evidence:
  current_level: E1
  required_for_specification_promotion: false
  note: >-
    E2, E3 and E4 remain stronger evidence claims. Their absence must remain
    explicit but cannot satisfy or bypass a repository-controlled v1.0 gate.

gates:
  - id: normative-stability
    state: satisfied
    blocking: true
    evidence:
      - governance/v1.0-normative-freeze.yaml
      - scripts/validate_v1_stable_controls.py
      - model/project/normative-document-manifest.yaml
    judgment: >-
      The v1.0 release-decision candidate binds the five normative candidate
      artifacts by exact Git blob SHA, defines material normative change, and
      requires evidence invalidation and gate reassessment after material drift.
    residual_work: none

  - id: identifier-stability
    state: satisfied
    blocking: true
    evidence:
      - scripts/build_identifier_registry.py
      - scripts/validate_identifier_registry.py
      - release/REQUIREMENTS-INVENTORY-v0.9.0.md
    judgment: >-
      The generated identifier registry and validator provide deterministic
      duplicate and resolution checks for the controlled identifier surface.
    residual_work: none

  - id: requirement-conformance-traceability
    state: satisfied
    blocking: true
    evidence:
      - scripts/build_requirements_register.py
      - scripts/validate_requirements_register.py
      - scripts/validate_candidate_specification.py
      - release/CONFORMANCE-COVERAGE-v0.9.0.md
    judgment: >-
      All 28 candidate requirements are represented in the requirements and
      conformance machinery and are checked by deterministic validation.
    residual_work: none

  - id: deterministic-validation
    state: satisfied
    blocking: true
    evidence:
      - Makefile
      - scripts/validate_repo.py
      - scripts/validate_schema_instances.py
      - scripts/validate_integration.py
      - scripts/check_built_site.py
      - scripts/validate_v1_stable_controls.py
    judgment: >-
      Repository, schema, integration, documentation, publication and stable
      governance controls execute through the repository-wide validation path
      and fail closed.
    residual_work: none

  - id: adversarial-negative-evidence
    state: satisfied
    blocking: true
    evidence:
      - governance/v1.0-adversarial-coverage.yaml
      - scripts/validate_v1_stable_controls.py
      - evidence/adversarial/event-01.yaml
      - scripts/validate_interoperability_candidate.py
    judgment: >-
      Thirteen consequential failure domains are explicitly classified as
      executable or assessor-verifiable, bound to requirements and evidence,
      with orphan-domain acceptance rejected by a falsification fixture.
    residual_work: none

  - id: compatibility-change-control
    state: satisfied
    blocking: true
    evidence:
      - governance/v1.x-change-control.yaml
      - scripts/validate_v1_stable_controls.py
    judgment: >-
      The v1.x contract requires explicit compatible, materially-normative or
      breaking classification; unknown classes fail closed, breaking changes
      require a major version, and material changes trigger evidence
      invalidation and assurance reassessment.
    residual_work: none

  - id: errata-process
    state: satisfied
    blocking: true
    evidence:
      - governance/errata-and-emergency-change.yaml
      - scripts/validate_v1_stable_controls.py
    judgment: >-
      Stable maintenance has an attributable correction lifecycle with bounded
      emergency authority, supersession, notification, evidence invalidation,
      reassessment and explicit terminal states. Authority-free emergency
      correction is rejected by a falsification fixture.
    residual_work: none

  - id: blocking-issue-disposition
    state: evidence-required
    blocking: true
    evidence:
      - https://github.com/sankarshanmukhopadhyay/open-national-digital-trust-framework/issues/5
      - https://github.com/sankarshanmukhopadhyay/open-national-digital-trust-framework/issues/11
      - https://github.com/sankarshanmukhopadhyay/open-national-digital-trust-framework/issues/14
      - https://github.com/sankarshanmukhopadhyay/open-national-digital-trust-framework/issues/15
      - https://github.com/sankarshanmukhopadhyay/open-national-digital-trust-framework/issues/16
      - https://github.com/sankarshanmukhopadhyay/open-national-digital-trust-framework/issues/17
    judgment: >-
      The historical repository-baseline blocker #5 is complete and #11 remains
      bounded non-blocking security evidence. Issues #14 through #17 are the
      release-relevant implementation controls represented by the current
      change and remain open until that implementation is merged and CI is
      accepted; therefore this gate is not pre-emptively marked satisfied.
    residual_work: >-
      Merge the implementation that closes #14, #15, #16 and #17 with green CI,
      then reconcile this gate against their authoritative closed state.
    non_blocking_residual_evidence:
      - source: https://github.com/sankarshanmukhopadhyay/open-national-digital-trust-framework/issues/11
        state: evidence-required
        scope: platform-security-and-action-pinning
        reason: >-
          The residual evidence constrains repository-security confidence but
          does not currently invalidate the stable specification contract.

  - id: release-integrity
    state: satisfied
    blocking: true
    evidence:
      - scripts/validate_release_integrity.py
      - scripts/validate_release.py
      - release/MANIFEST-v0.9.0.md
      - release/EVIDENCE-INVENTORY-v0.9.0.md
    judgment: >-
      The current release payload has deterministic integrity, manifest and
      coherence validation suitable as the baseline for constructing v1.0.
    residual_work: none

promotion_rule: >-
  promotion_ready may be true only when every gate required by
  governance/maturity.yaml is present exactly once and has state satisfied.
  Missing external E2, E3 or E4 evidence may constrain claims but must neither
  block specification promotion nor compensate for an unsatisfied repository-controlled gate.
